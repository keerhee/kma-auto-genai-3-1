<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EV Factory Flow</title>
<style>
:root{--line:#22304b;--text:#eaf0fa;--muted:#8ea2bf;--accent:#FFB547;--panel:rgba(15,24,42,.88)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100vh;color:var(--text);
  background:radial-gradient(1400px 800px at 50% 30%,#14213b 0%,#0a1120 55%,#060b15 100%);
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
.app{max-width:1240px;margin:0 auto;padding:14px 16px 20px;display:flex;flex-direction:column;gap:10px}
.top{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.badge{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:800;
  color:#0a1120;background:var(--accent);box-shadow:0 0 26px -2px var(--accent);transition:background .4s,box-shadow .4s}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.name{font-size:26px;font-weight:800;letter-spacing:-.01em}
.en{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.desc{margin-top:4px;font-size:15px;color:#c8d5ea;line-height:1.45}
.detail{margin-top:6px;font-size:13px;color:var(--accent);font-weight:600;min-height:18px;transition:color .4s}
.meta{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:4px 11px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);
  font-size:12px;font-weight:700;transition:all .4s}
.count{margin-top:10px;font-size:12px;color:var(--muted)}
.count b{font-size:22px;color:var(--text);margin-right:2px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.step{--c:#888;position:relative;overflow:hidden;background:#0d1628;border:1px solid var(--line);border-radius:10px;
  padding:8px 10px 11px;color:var(--muted);font-family:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:all .3s}
.step i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
  background:#1b2741;color:var(--muted);font-size:11px;margin-right:6px}
.step .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--c)}
.step.done{color:#c8d5ea}
.step.done i{background:var(--c);color:#0a1120;opacity:.7}
.step.on{color:var(--text);border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c),0 0 20px -6px var(--c)}
.step.on i{background:var(--c);color:#0a1120}
.stage{position:relative;width:100%;aspect-ratio:1085/650;border-radius:18px;border:1px solid var(--line);
  background:linear-gradient(#0d1527,#09101d);overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:14px;bottom:10px;font-size:12px;color:#5d7090;letter-spacing:.04em}
.time{position:absolute;right:14px;bottom:10px;font-size:12px;color:#7f93b2;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.controls button{font-family:inherit;font-size:14px;font-weight:700;color:var(--text);background:#18233a;border:1px solid #2c3b5c;
  border-radius:10px;padding:8px 14px;cursor:pointer;transition:all .2s}
.controls button:hover{border-color:var(--accent)}
.controls .primary{background:var(--accent);color:#0a1120;border-color:var(--accent);min-width:130px}
.seg{display:flex;align-items:center;gap:4px;padding:3px;border-radius:12px;background:#0d1628;border:1px solid var(--line)}
.seg span{font-size:13px;color:var(--muted);padding:0 8px}
.seg button{padding:6px 10px;border:none;background:transparent}
.seg button.on{background:#2a3a5c;box-shadow:inset 0 0 0 1px var(--accent)}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;color:#c8d5ea}
.switch input{display:none}
.switch .knob{width:42px;height:24px;border-radius:12px;background:#2a3550;position:relative;transition:.2s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#c8d5ea;transition:.2s}
.switch input:checked+.knob{background:var(--accent)}
.switch input:checked+.knob::after{left:21px;background:#0a1120}
.lab rect{fill:rgba(10,17,32,.8);stroke:#33415f;stroke-width:1;transition:all .3s}
.lab circle{fill:#26324d;transition:all .3s}
.lab .num{fill:#9fb0cb;font-size:11px;font-weight:800}
.lab .lbl{fill:#9fb0cb;font-size:13px;font-weight:700}
.lab.on rect{fill:var(--c);stroke:var(--c)}
.lab.on circle{fill:#0a1120}
.lab.on .num{fill:var(--c)}
.lab.on .lbl{fill:#0a1120}
@media (max-width:760px){
  .top{grid-template-columns:auto 1fr;gap:12px}
  .meta{grid-column:1/-1;text-align:left;display:flex;align-items:center;gap:14px}
  .count{margin-top:0}
  .name{font-size:21px}.desc{font-size:14px}
  .badge{width:48px;height:48px;font-size:23px}
  .steps{grid-template-columns:repeat(4,1fr)}
  .cap{display:none}
  .step{font-size:11px;padding:6px 6px 9px}.step i{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="badge" id="badge">1</div>
    <div>
      <div class="title-row"><span class="name" id="stName">부품 투입</span><span class="en" id="stEn">Parts Feeding</span></div>
      <div class="desc" id="stDesc"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="meta">
      <span class="tag" id="tag">이송 중</span>
      <div class="count">완성 차량 <b id="count">0</b>대</div>
    </div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="stage">
    <svg id="scene" viewBox="-475 -165 1085 650" preserveAspectRatio="xMidYMid meet">
      <defs>
        <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b"/>
          <feComponentTransfer in="b" result="b2"><feFuncA type="linear" slope="0.85"/></feComponentTransfer>
          <feComponentTransfer in="SourceGraphic" result="s">
            <feFuncR type="linear" slope="1.2"/><feFuncG type="linear" slope="1.2"/><feFuncB type="linear" slope="1.2"/>
          </feComponentTransfer>
          <feMerge><feMergeNode in="b2"/><feMergeNode in="s"/></feMerge>
        </filter>
        <filter id="dim" color-interpolation-filters="sRGB">
          <feColorMatrix type="saturate" values="0.25"/>
          <feComponentTransfer><feFuncR type="linear" slope="0.6"/><feFuncG type="linear" slope="0.6"/><feFuncB type="linear" slope="0.66"/></feComponentTransfer>
        </filter>
        <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
      </defs>
    </svg>
    <div class="cap">전기차 제조 공정 흐름 · 차체 라인과 배터리 라인이 마리지에서 합류합니다</div>
    <div class="time" id="time">00:00 / 00:00</div>
  </div>
  <div class="controls">
    <button id="play" class="primary">❚❚ 일시정지</button>
    <button id="restart">↺ 처음부터</button>
    <div class="seg" id="speed"><span>속도</span>
      <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button><button data-s="4">4×</button>
    </div>
    <label class="switch"><input type="checkbox" id="loop" checked><span class="knob"></span>반복 재생</label>
  </div>
</div>

<script>
(() => {
const NS = 'http://www.w3.org/2000/svg';
// ---------- isometric math ----------
const T = 22, CX = Math.cos(Math.PI / 6) * T, SY = T * 0.5, KZ = T * 0.95;
const iso = (x, y, z = 0) => [(x - y) * CX, (x + y) * SY - z * KZ];
const F = q => q[0].toFixed(1) + ',' + q[1].toFixed(1);
const P = (x, y, z = 0) => F(iso(x, y, z));
const poly = a => a.map(p => P(p[0], p[1], p[2] || 0)).join(' ');
const el = (t, a = {}) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const h2r = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16)); };
const r2h = c => '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const shade = (h, a) => r2h(h2r(h).map(v => a >= 0 ? v + (255 - v) * a : v * (1 + a)));
const mix = (a, b, t) => { const A = h2r(a), B2 = h2r(b); return r2h(A.map((v, i) => v + (B2[i] - v) * t)); };

function svgBox(x, y, z, dx, dy, dz, col, o = {}) {
  const op = o.op ?? 1, st = o.stroke || shade(col, -0.45), sw = o.sw ?? 0.7;
  const top = o.top || shade(col, 0.16), lf = o.left || shade(col, -0.06), rt = o.right || shade(col, -0.3);
  return `<g opacity="${op}" stroke="${st}" stroke-width="${sw}" stroke-linejoin="round">` +
    `<polygon fill="${lf}" points="${poly([[x, y + dy, z], [x + dx, y + dy, z], [x + dx, y + dy, z + dz], [x, y + dy, z + dz]])}"/>` +
    `<polygon fill="${rt}" points="${poly([[x + dx, y, z], [x + dx, y + dy, z], [x + dx, y + dy, z + dz], [x + dx, y, z + dz]])}"/>` +
    `<polygon fill="${top}" points="${poly([[x, y, z + dz], [x + dx, y, z + dz], [x + dx, y + dy, z + dz], [x, y + dy, z + dz]])}"/></g>`;
}
const B = (x, y, z, dx, dy, dz, col, o) => ({ x, y, z, dx, dy, dz, col, o });
function sortBoxes(a) {
  const e = 1e-6;
  return a.slice().sort((p, q) => {
    const pq = (p.x + p.dx <= q.x + e) || (p.y + p.dy <= q.y + e) || (p.z + p.dz <= q.z + e);
    const qp = (q.x + q.dx <= p.x + e) || (q.y + q.dy <= p.y + e) || (q.z + q.dz <= p.z + e);
    if (pq && !qp) return -1;
    if (qp && !pq) return 1;
    return (p.x + p.dx / 2 + p.y + p.dy / 2 + p.z + p.dz / 2) - (q.x + q.dx / 2 + q.y + q.dy / 2 + q.z + q.dz / 2);
  });
}
const renderBoxes = arr => sortBoxes(arr).map(b => svgBox(b.x, b.y, b.z, b.dx, b.dy, b.dz, b.col, b.o || {})).join('');
const addHTML = (parent, html) => { const g = el('g'); g.innerHTML = html; parent.appendChild(g); return g; };

// ---------- data ----------
const ROBOT = '#F0862E', SILVER = '#9AA5B4';
const PAINTS = ['#E0313F', '#2F6BFF', '#EEF1F5', '#18A57F', '#F2A20C'];
const ST = [
  { name: '프레스·부품 투입', en: 'Press · Parts Feeding', color: '#FFB547', c: [3, 2], row: 1,
    desc: '프레스에서 성형한 차체 패널을 팔레트에 실어 차체 라인에 공급합니다.' },
  { name: '차체 용접', en: 'Body in White (BIW)', color: '#3FD0FF', c: [10, 2], row: 1,
    desc: '용접 로봇이 패널을 스폿 용접해 도장 전 강판 차체인 화이트 바디(BIW)를 만듭니다.' },
  { name: '도장', en: 'Paint Shop', color: '#FF5FA2', c: [17, 2], row: 1,
    desc: '전처리와 전착 도장(E-coat)을 거친 차체에 도장 로봇이 중도와 상도를 분사합니다.' },
  { name: '배터리 팩 조립', en: 'Battery Pack · Skateboard', color: '#38BDF8', c: [24.5, 3], row: 3, r: 2.0,
    desc: '별도 서브라인에서 트레이에 배터리 모듈을 적재하고, 구동 유닛과 바퀴를 단 스케이트보드 플랫폼을 만듭니다.' },
  { name: '마리지', en: 'Marriage', color: '#F97316', c: [21, 10], row: 2, r: 2.5,
    desc: '도장 라인에서 온 차체와 배터리 라인에서 온 플랫폼이 합류합니다. 차체를 내려 플랫폼에 결합하고 볼트로 고정합니다.' },
  { name: '의장', en: 'Trim & Final', color: '#46E3A0', c: [14, 10], row: 2,
    desc: '의장 라인에서 시트와 내장 부품, 유리를 차체에 장착합니다.' },
  { name: 'EOL 검사·출하', en: 'End-of-Line Test · Shipping', color: '#A78BFA', c: [7, 10], row: 2,
    desc: '외관과 전장품, 고전압 절연 상태를 검사하고, 합격한 차량을 출하 트레일러에 싣습니다.' }
];
const PATH = [[-3.2, 2], [3, 2], [10, 2], [17, 2], [21, 2], [21, 10], [14, 10], [7, 10], [-1.2, 10], [-4.4, 10]];
const CUM = [0];
for (let i = 1; i < PATH.length; i++) CUM.push(CUM[i - 1] + Math.hypot(PATH[i][0] - PATH[i - 1][0], PATH[i][1] - PATH[i - 1][1]));
const SPI = [1, 2, 3, 5, 5, 6, 7];
// battery sub-line: pack station -> down the line -> sideways into the marriage station
const BPATH = [[24.5, 3], [24.5, 10], [21, 10]];
const BCUM = [0, 7, 10.5];
function bPoint(d) {
  if (d <= BCUM[1]) return [24.5, 3 + d];
  return [24.5 - (d - BCUM[1]), 10];
}
const MOD = [[-0.36, -0.8], [0.36, -0.8], [-0.36, 0], [0.36, 0], [-0.36, 0.8], [0.36, 0.8]];
const PICKB = [26.6, 1.3, 1.25];
const planB = f => plan(f, 0.04, 0.085, 6, PICKB, k => [24.5 + MOD[k][0], 3 + MOD[k][1], 0.95]);
const LIFT = 1.4;
function pointAt(d) {
  for (let i = 1; i < PATH.length; i++) {
    if (d <= CUM[i] + 1e-9 || i === PATH.length - 1) {
      const a = PATH[i - 1], b = PATH[i], L = CUM[i] - CUM[i - 1], u = clamp((d - CUM[i - 1]) / L);
      return { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u, dir: [(b[0] - a[0]) / L, (b[1] - a[1]) / L] };
    }
  }
}
const dirInto = k => { const a = PATH[k - 1], b = PATH[k], L = Math.hypot(b[0] - a[0], b[1] - a[1]); return [(b[0] - a[0]) / L, (b[1] - a[1]) / L]; };

const PH = [
  { type: 'move', from: 0, to: 1, dur: 2.0, stage: 0 },
  { type: 'work', st: 0, dur: 4.4, stage: 0 },
  { type: 'move', from: 1, to: 2, dur: 2.4, stage: 1 },
  { type: 'work', st: 1, dur: 4.8, stage: 1 },
  { type: 'move', from: 2, to: 3, dur: 2.4, stage: 2 },
  { type: 'work', st: 2, dur: 4.8, stage: 2 },
  { type: 'battery', st: 3, dur: 6.4, stage: 3 },
  { type: 'work', st: 4, dur: 5.6, stage: 4 },
  { type: 'move', from: 5, to: 6, dur: 2.4, stage: 5 },
  { type: 'work', st: 5, dur: 5.0, stage: 5 },
  { type: 'move', from: 6, to: 7, dur: 2.4, stage: 6 },
  { type: 'work', st: 6, dur: 4.2, stage: 6 },
  { type: 'move', from: 7, to: 9, dur: 3.0, stage: 6 },
  { type: 'depart', dur: 2.6, stage: 6 },
  { type: 'rest', dur: 0.8, stage: 6 }
];
// phase indices used below
const PI = { battery: 6, marriage: 7, toTrim: 8, trim: 9, toEol: 10, eol: 11, load: 12, depart: 13, rest: 14 };
let TOTAL = 0;
PH.forEach(p => { p.t0 = TOTAL; TOTAL += p.dur; });
const STG = ST.map((_, i) => { const ps = PH.filter(p => p.stage === i); return { t0: ps[0].t0, dur: ps.reduce((s, p) => s + p.dur, 0) }; });
function phaseAt(t) {
  for (let i = 0; i < PH.length; i++) if (t < PH[i].t0 + PH[i].dur) return [i, (t - PH[i].t0) / PH[i].dur];
  return [PH.length - 1, 1];
}

// ---------- robot plans ----------
const SLOTS = [[-0.67, -0.42], [0.67, -0.42], [-0.67, 0.42], [0.67, 0.42]];
const PICK1 = [1.6, -1.0, 2.45], PICK4A = [12.05, 6.05, 1.15], PICK4B = [13.45, 13.35, 1.15];
function plan(f, start, per, n, pick, place) {
  if (f < start) return { tg: pick.slice(), carry: false, done: 0 };
  const q = (f - start) / per; const k = Math.floor(q), u = q - k;
  if (k >= n) return { tg: pick.slice(), carry: false, done: n };
  const pl = place(k); let tg, carry;
  if (u < 0.45) { const v = ease(u / 0.45); tg = lerp3(pick, pl, v); tg[2] += Math.sin(Math.PI * v) * 0.8; carry = true; }
  else if (u < 0.55) { tg = pl.slice(); carry = u < 0.5; }
  else { const v = ease((u - 0.55) / 0.45); tg = lerp3(pl, pick, v); tg[2] += Math.sin(Math.PI * v) * 0.8; carry = false; }
  return { tg, carry, done: k + (u >= 0.5 ? 1 : 0) };
}
const plan1 = f => plan(f, 0.06, 0.21, 4, PICK1, k => [3 + SLOTS[k][0], 2 + SLOTS[k][1], 1.05]);
const plan4 = (f, side) => plan(f, 0.06, 0.2, 2, side ? PICK4B : PICK4A, k => [k === 0 ? 13.55 : 14.45, side ? 10.35 : 9.65, 1.35]);

// ---------- scene layers ----------
const svg = document.getElementById('scene');
const L = {};
['floor', 'pad', 'back1', 'conv1', 'slot1', 'front1', 'back3', 'conv3', 'slot3', 'front3', 'back2', 'conv2', 'slot2', 'front2', 'hi', 'label'].forEach(k => { L[k] = el('g'); svg.appendChild(L[k]); });

// floor
let floorHTML = svgBox(-9.5, -3.5, -0.5, 37.5, 18, 0.5, '#141c2e', { stroke: '#2a3753', sw: 1 });
floorHTML += '<g stroke="#1e2a43" stroke-width="0.7" fill="none">';
for (let x = -9; x <= 27; x++) floorHTML += `<polyline points="${P(x, -3.5)} ${P(x, 14.5)}"/>`;
for (let y = -3; y <= 14; y++) floorHTML += `<polyline points="${P(-9.5, y)} ${P(28, y)}"/>`;
floorHTML += '</g><g stroke="#e8b73a" stroke-opacity=".55" stroke-width="1.6" stroke-dasharray="8 6" fill="none">' +
  `<polyline points="${P(-1.5, 5.0)} ${P(19, 5.0)}"/><polyline points="${P(-1.5, 7.0)} ${P(19, 7.0)}"/>` +
  `<polygon points="${poly([[-9.2, 7.8], [-1.4, 7.8], [-1.4, 12.2], [-9.2, 12.2]])}"/></g>`;
L.floor.innerHTML = floorHTML;

// pads
ST.forEach(s => {
  const [cx, cy] = s.c, r = s.r || 2.9;
  s.pad = el('polygon', { points: poly([[cx - r, cy - r], [cx + r, cy - r], [cx + r, cy + r], [cx - r, cy + r]]),
    fill: s.color, 'fill-opacity': .06, stroke: s.color, 'stroke-opacity': .3, 'stroke-width': 1.4 });
  L.pad.appendChild(s.pad);
});

// conveyors
const CONV = '#2a3347', CONV_O = { top: '#323d56', stroke: '#11182a', sw: 1 };
addHTML(L.conv1, svgBox(-3.8, 0.9, 0, 23.7, 2.2, 0.5, CONV, CONV_O));

  switch (pi) {
    case 0: return { kind: 'parts', n: 0 };
    case 1: return { kind: 'parts', n: plan1(f).done };
    case 2: return { kind: 'parts', n: 4 };
    case 3: return f < 0.42 ? { kind: 'parts', n: 4 } : { kind: 'body', color: SILVER, wheels: 0, glass: false };
    case 4: return { kind: 'body', color: SILVER, wheels: 0, glass: false };
    case 5: return { kind: 'body', color: mix(SILVER, paint, smooth(0.12, 0.88, f)), wheels: 0, glass: false };
    case 6: return { kind: 'body', color: paint, wheels: 0, glass: false };                  // waits for the platform
    case 7: return f < 0.8 ? { kind: 'body', color: paint, wheels: 0, glass: false }
                           : { kind: 'body', color: paint, wheels: 4, glass: false };       // married to the platform
    case 8: return { kind: 'body', color: paint, wheels: 4, glass: false };
    case 9: return { kind: 'body', color: paint, wheels: 4, glass: f > 0.72 };
    case 10: return done;
    case 11: done.check = f > 0.88; return done;
    case 12: done.check = true; return done;
    default: return null;
  }
}
// platform: modules stacked at the pack station, then carried down the sub-line into the marriage station
function platformState(pi, f) {
  if (pi === PI.battery) {
    const n = planB(f).done, full = f > 0.6;
    const d = BCUM[1] * ease(smooth(0.7, 1, f));
    return { n, full, pos: bPoint(d) };
  }
  if (pi === PI.marriage && f < 0.8) return { n: 6, full: true, pos: bPoint(BCUM[1] + (BCUM[2] - BCUM[1]) * ease(smooth(0.04, 0.42, f))) };
  return null;
}
function detailText(pi, f) {
  switch (pi) {
    case 0: return '빈 팔레트가 투입 구역으로 들어옵니다.';
    case 1: return `로봇이 프레스 패널을 팔레트에 올립니다 (${plan1(f).done}/4).`;
    case 2: return '부품 팔레트를 차체 용접 셀로 이송합니다.';
    case 3: return f < 0.42 ? '용접 지그에 패널을 고정합니다.' : '스폿 용접으로 화이트 바디(BIW)를 완성합니다.';
    case 4: return 'BIW를 도장 부스로 이송합니다.';
    case 5: return `도장 로봇이 상도를 분사합니다 (${Math.round(smooth(0.12, 0.88, f) * 100)}%).`;
    case 6:
      if (f < 0.6) return `배터리 라인에서 로봇이 모듈을 트레이에 적재합니다 (${planB(f).done}/6). 차체는 마리지 스테이션으로 이동합니다.`;
      if (f < 0.7) return '구동 유닛과 바퀴를 달아 스케이트보드 플랫폼을 완성합니다.';
      return '플랫폼이 서브라인을 따라 마리지 스테이션으로 이동하고, 호이스트가 차체를 들어 올립니다.';
    case 7:
      if (f < 0.45) return '플랫폼이 들어 올린 차체 아래로 들어옵니다. 두 라인이 이곳에서 합류합니다.';
      if (f < 0.8) return '차체를 내려 플랫폼에 정렬합니다.';
      return '체결 볼트로 차체와 플랫폼을 고정해 하나의 차량이 됩니다.';
    case 8: return '결합된 차량을 의장 라인으로 이송합니다.';
    case 9: return f < 0.48 ? `로봇이 시트를 실내에 장착합니다 (${plan4(f, 0).done + plan4(f, 1).done}/4).` : '호이스트로 윈드실드를 내려 장착합니다.';
    case 10: return '완성차를 EOL 검사 게이트로 이송합니다.';
    case 11: return f < 0.88 ? '스캐너가 외관과 단차, 고전압 절연 상태를 검사합니다.' : '검사에 합격해 출하를 승인합니다.';
    case 12: return '합격 차량을 출하 트레일러에 싣습니다.';
    case 13: return '트레일러가 출하장을 떠납니다.';
    default: return '다음 차량을 준비합니다.';
  }
}
function tagText(pi) {
  const p = PH[pi];
  if (pi === PI.load) return '출하 적재';
  if (pi === PI.depart) return '출하';
  if (pi === PI.battery) return '서브라인 작업';
  if (pi === PI.marriage) return '합류·결합';
  if (p.type === 'rest') return '대기';
  return p.type === 'work' ? '작업 중' : '이송 중';
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const stepsEl = $('steps');
ST.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'step'; b.style.setProperty('--c', s.color);
  b.innerHTML = `<i>${i + 1}</i>${s.name}<span class="fill"></span>`;
  b.onclick = () => { tau = STG[i].t0; prevPi = phaseAt(tau)[0]; finished = false; syncPlay(); };
  stepsEl.appendChild(b); s.chip = b; s.fill = b.querySelector('.fill');
});
function setStage(i) {
  curStage = i;
  const s = ST[i];
  document.documentElement.style.setProperty('--accent', s.color);
  $('badge').textContent = i + 1; $('stName').textContent = s.name; $('stEn').textContent = s.en; $('stDesc').textContent = s.desc;
  ST.forEach((o, j) => {
    const on = j === i, f = on ? 'url(#glow)' : 'url(#dim)';
    o.gb.setAttribute('filter', f); o.gf.setAttribute('filter', f);
    o.pad.setAttribute('fill-opacity', on ? .22 : .05); o.pad.setAttribute('stroke-opacity', on ? 1 : .25);
    o.lab.classList.toggle('on', on);
    o.chip.classList.toggle('on', on); o.chip.classList.toggle('done', j < i);
  });
}
const playBtn = $('play');
function syncPlay() { playBtn.textContent = playing ? '❚❚ 일시정지' : (finished ? '▶ 다시 재생' : '▶ 재생'); }
playBtn.onclick = () => { if (finished) { tau = 0; prevPi = 0; finished = false; playing = true; } else playing = !playing; syncPlay(); };
$('restart').onclick = () => { tau = 0; prevPi = 0; finished = false; playing = true; syncPlay(); };
$('loop').onchange = e => { loop = e.target.checked; };
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  speed = +b.dataset.s;
  document.querySelectorAll('#speed button').forEach(x => x.classList.toggle('on', x === b));
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'r' || e.key === 'R') $('restart').click();
});
const mmss = t => { t = Math.max(0, t); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
let lastDetail = '', lastTag = '';

// ---------- frame ----------
function stepFrame(dt) {
  if (playing) {
    tau += dt * speed; anim += dt * speed;
    if (tau >= TOTAL) {
      if (loop) tau -= TOTAL;
      else { tau = TOTAL - 1e-4; playing = false; finished = true; syncPlay(); }
    }
  }
  const [pi, f] = phaseAt(tau), ph = PH[pi];
  if (prevPi === PI.depart && pi === PI.rest) { produced++; $('count').textContent = produced; }
  prevPi = pi;
  if (ph.stage !== curStage) setStage(ph.stage);

  // belts: body line moves while the car travels, battery line while the platform travels
  const bodyMoving = (ph.type === 'move' && pi <= PI.load) || (pi === PI.battery && f < 0.55);
  if (playing && bodyMoving) belt += dt * speed * 38;
  stripe1.setAttribute('stroke-dashoffset', (-belt).toFixed(1));
  stripe2.setAttribute('stroke-dashoffset', (-belt).toFixed(1));
  const platMoving = (pi === PI.battery && f > 0.7) || (pi === PI.marriage && f < 0.42);
  if (playing && platMoving) belt3 += dt * speed * 38;
  stripe3.setAttribute('stroke-dashoffset', (-belt3).toFixed(1));
  stripe3b.setAttribute('stroke-dashoffset', (-belt3).toFixed(1));

  // product (body / car)
  let pos = null, dir = [1, 0], lift = 0;
  if (ph.type === 'move') { const d = CUM[ph.from] + ease(f) * (CUM[ph.to] - CUM[ph.from]); const p = pointAt(d); pos = [p.x, p.y]; dir = p.dir; }
  else if (ph.type === 'battery') {
    if (f < 0.55) { const d = CUM[3] + ease(f / 0.55) * (CUM[5] - CUM[3]); const p = pointAt(d); pos = [p.x, p.y]; dir = p.dir; }
    else { pos = PATH[5]; dir = dirInto(5); }
    lift = LIFT * smooth(0.6, 0.85, f);
  }
  else if (ph.type === 'work') {
    const k = SPI[ph.st]; pos = PATH[k]; dir = dirInto(k);
    if (pi === PI.marriage) lift = LIFT * (1 - smooth(0.46, 0.78, f));
  }
  const st = productState(pi, f);
  if (!pos || !st) carG.style.display = 'none';
  else {
    carG.style.display = '';
    const d = dir.map(v => Math.round(v));
    const key = JSON.stringify(st) + d.join();
    if (key !== carKey) { carG.innerHTML = carSVG(st, d); carKey = key; }
    const q = iso(pos[0], pos[1], 0.5 + lift);
    carG.setAttribute('transform', `translate(${q[0].toFixed(2)},${q[1].toFixed(2)})`);
    const slot = (pos[1] < 6 && pos[0] < 19.6) ? 1 : 2;
    if (slot !== carSlot) { (slot === 1 ? L.slot1 : L.slot2).insertBefore(carG, slot === 1 ? fx1 : fx2); carSlot = slot; }
    carG.setAttribute('opacity', pi === PI.load ? clamp((pos[0] + 4.4) / 1.6).toFixed(2) : 1);
  }

  // platform on the battery sub-line
  const pst = platformState(pi, f);
  if (!pst) platG.style.display = 'none';
  else {
    platG.style.display = '';
    const key = pst.n + '|' + pst.full;
    if (key !== platKey) { platG.innerHTML = platformSVG(pst.n, pst.full); platKey = key; }
    const q = iso(pst.pos[0], pst.pos[1], 0.4);
    platG.setAttribute('transform', `translate(${q[0].toFixed(2)},${q[1].toFixed(2)})`);
    // at the station it sits in its own layer; on the line it joins the body line layer,
    // drawn in front of the car while approaching and under it once inside the station
    const want = pst.pos[1] < 6 ? 3 : (pst.pos[0] > 22.6 ? 'front' : 'under');
    if (want !== platSlot) {
      if (want === 3) L.slot3.appendChild(platG);
      else if (want === 'front') L.slot2.insertBefore(platG, fx2);
      else L.slot2.insertBefore(platG, carG.parentNode === L.slot2 ? carG : fx2);
      platSlot = want;
    }
  }

  // marriage hoist + bolting glow
  {
    const hz = 0.5 + lift + 1.3, show = (pi === PI.battery && f > 0.55) || (pi === PI.marriage && f < 0.86);
    R.mhoist.innerHTML = `<polyline points="${P(21, 10, 4.2)} ${P(21, 10, show ? hz + 0.2 : 3.4)}" stroke="#c9d3e3" stroke-width="1.5"/>` +
      svgBox(20.4, 9.2, show ? hz : 3.2, 1.2, 1.6, 0.14, '#f2c94c');
    if (pi === PI.marriage && f > 0.78 && f < 0.97) {
      const pulse = 0.5 + 0.5 * Math.sin(anim * 18);
      R.bolt.innerHTML = [[20.3, 8.9], [21.7, 8.9], [20.3, 11.1], [21.7, 11.1]].map(([x, y]) => {
        const t = iso(x, y, 0.75); return `<circle cx="${t[0].toFixed(1)}" cy="${t[1].toFixed(1)}" r="${(3 + 2 * pulse).toFixed(1)}" fill="#ffd27a" opacity="${(0.6 + 0.4 * pulse).toFixed(2)}"/>`;
      }).join('');
    } else R.bolt.innerHTML = '';
  }

  // stations
  const wf = i => ((ph.type === 'work' || ph.type === 'battery') && ph.st === i) ? f : -1;
  const bw = x => x < 0 ? 0 : Math.min(smooth(0, 0.08, x), 1 - smooth(0.92, 1, x));
  { // S1
    const f1 = wf(0); let tg = R.s1.rest, carry = false;
    if (f1 >= 0) { const o = plan1(f1); tg = lerp3(R.s1.rest, o.tg, bw(f1)); carry = o.carry; }
    drawArm(R.s1, tg, carry);
  }
  { // S2 welding
    const f2 = wf(1), w = bw(f2);
    const A = lerp3(R.s2a.rest, [10 + 1.15 * Math.sin(anim * 2.3), 1.15, 1.1 + 0.2 * Math.sin(anim * 3.7)], w);
    const Bq = lerp3(R.s2b.rest, [10 - 1.15 * Math.sin(anim * 2.1 + 1), 2.85, 1.1 + 0.2 * Math.sin(anim * 3.3 + 2)], w);
    drawArm(R.s2a, A); drawArm(R.s2b, Bq);
    if (f2 > 0.06 && f2 < 0.94) {
      sparkG.style.display = '';
      const tips = [iso(...A), iso(...Bq)];
      sparks.forEach((c, i) => {
        const t = tips[i % 2], a = Math.random() * Math.PI * 2, rr = Math.random() * 14;
        c.setAttribute('cx', (t[0] + Math.cos(a) * rr).toFixed(1)); c.setAttribute('cy', (t[1] + Math.sin(a) * rr * 0.8 + rr * 0.3).toFixed(1));
        c.setAttribute('r', (0.6 + Math.random() * 1.6).toFixed(1)); c.setAttribute('opacity', (0.3 + Math.random() * 0.7).toFixed(2));
      });
      cores.forEach((c, i) => { c.setAttribute('cx', tips[i][0].toFixed(1)); c.setAttribute('cy', tips[i][1].toFixed(1)); c.setAttribute('opacity', (0.5 + Math.random() * 0.5).toFixed(2)); });
    } else sparkG.style.display = 'none';
  }
  { // S3 painting
    const f3 = wf(2), w = bw(f3);
    const A = lerp3(R.s3a.rest, [15.8 + 1.3 * (0.5 + 0.5 * Math.sin(anim * 1.8)), 2.0, 2.7], w);
    const Bq = lerp3(R.s3b.rest, [17.0 + 1.3 * (0.5 + 0.5 * Math.sin(anim * 1.8 + Math.PI)), 2.0, 2.7], w);
    drawArm(R.s3a, A); drawArm(R.s3b, Bq);
    if (f3 > 0.08 && f3 < 0.92) {
      const pc = paintNow();
      mistG.innerHTML = [A, Bq].map(p => {
        const t = iso(p[0], p[1], p[2]), e = iso(p[0], 2, 1.8), op = (0.28 + 0.12 * Math.sin(anim * 20 + p[0])).toFixed(2);
        return `<polygon points="${F(t)} ${P(p[0] - 0.6, 2, 1.8)} ${P(p[0] + 0.6, 2, 1.8)}" fill="${pc}" opacity="${op}" filter="url(#soft)"/>` +
          `<ellipse cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" rx="20" ry="9" fill="${pc}" opacity=".35" filter="url(#soft)"/>`;
      }).join('');
    } else mistG.innerHTML = '';
  }
  { // battery pack station
    const fb = wf(3); let tg = R.sb.rest, carry = false;
    if (fb >= 0 && fb < 0.62) { const o = planB(fb); tg = lerp3(R.sb.rest, o.tg, Math.min(smooth(0, 0.04, fb), 1 - smooth(0.56, 0.62, fb))); carry = o.carry; }
    drawArm(R.sb, tg, carry);
  }
  { // trim: seats + windshield
    const f4 = wf(5), w = bw(f4);
    let tA = R.s4a.rest, tB = R.s4b.rest, cA = false, cB = false;
    if (f4 >= 0) {
      const oa = plan4(f4, 0), ob = plan4(f4, 1);
      tA = lerp3(R.s4a.rest, oa.tg, w); tB = lerp3(R.s4b.rest, ob.tg, w); cA = oa.carry; cB = ob.carry;
    }
    drawArm(R.s4a, tA, cA); drawArm(R.s4b, tB, cB);
    let hz = 3.5, part = false;
    if (f4 >= 0) { part = f4 < 0.74; hz = 3.5 - 1.75 * smooth(0.48, 0.68, f4) + 1.75 * smooth(0.78, 0.95, f4); }
    R.hoist.innerHTML = `<polyline points="${P(14, 10, 3.8)} ${P(14, 10, hz + 0.15)}" stroke="#c9d3e3" stroke-width="1.5"/>` +
      svgBox(13.85, 9.85, hz + 0.15, 0.3, 0.3, 0.2, '#f2c94c') + (part ? svgBox(13.5, 9.35, hz - 0.05, 0.9, 1.3, 0.12, '#35557f') : '');
  }
  { // S5 inspection
    const f5 = wf(6);
    if (f5 > 0.05 && f5 < 0.86) {
      const u = (f5 - 0.05) / 0.81, sx = 7 + 1.9 * Math.cos(u * Math.PI * 3);
      scanG.innerHTML = `<polygon points="${poly([[sx, 8.5, 0.5], [sx, 11.5, 0.5], [sx, 11.5, 2.7], [sx, 8.5, 2.7]])}" fill="#b9a6ff" fill-opacity=".22" stroke="#d6ccff" stroke-width="1.6"/>` +
        `<polyline points="${P(sx, 8.5, 1.3)} ${P(sx, 11.5, 1.3)}" stroke="#ffffff" stroke-width="1.6"/>`;
    } else scanG.innerHTML = '';
    let lc = '#4b5568';
    if (pi === PI.eol) lc = f > 0.88 ? '#2ee59d' : (Math.floor(anim * 6) % 2 ? '#ffb020' : '#ff4d6d');
    else if (pi === PI.load || pi === PI.depart) lc = '#2ee59d';
    R.lamp.innerHTML = svgBox(6.85, 9.8, 3.3, 0.3, 0.4, 0.28, lc, { stroke: shade(lc, -0.4) });
  }
  { // truck
    let tdx = 0, op = 1;
    if (pi === 0) op = smooth(0, 0.6, f);
    else if (pi === PI.depart) { tdx = -12 * f * f; op = 1 - smooth(0.55, 1, f); }
    else if (pi === PI.rest) op = 0;
    const q = iso(tdx, 0, 0);
    truckG.setAttribute('transform', `translate(${q[0].toFixed(1)},${q[1].toFixed(1)})`);
    truckG.setAttribute('opacity', op.toFixed(2));
  }

  // highlight + UI
  ST.forEach((s, i) => s.hi.setAttribute('opacity', i === ph.stage ? (0.7 + 0.3 * Math.sin(anim * 5)).toFixed(2) : 0));
  ST.forEach((s, i) => { s.fill.style.width = (clamp((tau - STG[i].t0) / STG[i].dur) * 100).toFixed(1) + '%'; });
  const dtxt = detailText(pi, f); if (dtxt !== lastDetail) { $('detail').textContent = dtxt; lastDetail = dtxt; }
  const ttxt = tagText(pi); if (ttxt !== lastTag) { $('tag').textContent = ttxt; lastTag = ttxt; }
  $('time').textContent = `${mmss(tau)} / ${mmss(TOTAL)}`;
}
let last = performance.now();
function loopFrame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  stepFrame(dt);
  requestAnimationFrame(loopFrame);
}
syncPlay();
requestAnimationFrame(loopFrame);
})();
</script>
</body>
</html>
